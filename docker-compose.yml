version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - CLIENT_URL=http://localhost:5173

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      - server

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    environment:
      - SERVER_URL=http://server:3001
      - SIMULATOR_INTERVAL_MS=2000
    depends_on:
      - server
